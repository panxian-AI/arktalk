<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArkTalk</title>
<link rel="icon" type="image/png" href="/icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <nav id="rail">
    <img id="rail-logo" src="/icon.png" title="ArkTalk" alt="ArkTalk">
    <img id="rail-avatar" class="rail-avatar" title="我的账号" alt="">
    <button class="rail-btn active" data-tab="chats" title="消息">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 3C6.9 3 3 6.5 3 10.8c0 2.3 1.1 4.3 3 5.7-.1 1-.5 2.1-1.4 3.1 1.7-.1 3.1-.7 4.2-1.5 1 .3 2.1.4 3.2.4 5.1 0 9-3.5 9-7.7S17.1 3 12 3z"/></svg>
    </button>
    <button class="rail-btn" id="rail-friends" data-tab="friends" title="联系人">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 12a4.2 4.2 0 1 0 0-8.4 4.2 4.2 0 0 0 0 8.4zm0 1.8c-4 0-7.5 2.4-7.5 5.4V21h15v-1.8c0-3-3.5-5.4-7.5-5.4z"/></svg>
      <span id="fr-badge" class="fr-badge" hidden></span>
    </button>
    <button class="rail-btn" data-tab="groups" title="群聊">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M8.5 11a3.4 3.4 0 1 0 0-6.8 3.4 3.4 0 0 0 0 6.8zm9 0a3.4 3.4 0 1 0 0-6.8 3.4 3.4 0 0 0 0 6.8zM8.5 13c-3.2 0-6 1.9-6 4.4V20h12v-2.6c0-2.5-2.8-4.4-6-4.4zm9 .4c-.6 0-1.2.1-1.8.2 1.3 1 2.1 2.4 2.1 3.8V20h4v-2.2c0-2.4-2.2-4.4-4.3-4.4z"/></svg>
    </button>
    <div class="rail-spacer"></div>
    <span id="conn-dot" class="dot off" title="运行状态"></span>
  </nav>
  <aside id="sidebar">
    <div id="search-bar">
      <input id="search" type="text" placeholder="搜索">
      <button id="btn-add" title="添加" hidden>＋<span id="btn-add-badge" class="add-badge" hidden></span></button>
    </div>
    <!-- 在线概览：把"谁在线"写成文字，不用再靠猜小圆点 -->
    <div id="online-bar" hidden></div>
    <div id="list"></div>
  </aside>
  <main id="chat">
    <div id="chat-empty">
      <div class="empty-icon">💬</div>
      <div>选择一个会话开始聊天</div>
      <div class="empty-sub">端对端聊天 · P2P 直连 · 本机记录 · 联系人手动添加</div>
    </div>
    <div id="chat-pane" hidden>
      <header id="chat-header">
        <button id="btn-back" title="返回会话列表">‹</button>
        <img id="chat-avatar" class="avatar" alt="">
        <div class="chat-title">
          <div class="chat-name-row"><span id="chat-dot" class="on-dot off" hidden></span><div id="chat-name"></div></div>
          <div id="chat-sub"></div>
        </div>
        <span id="chat-upstream" class="upstream-pill" hidden>对方设备离线 · 消息排队待发</span>
      </header>
      <div id="messages"></div>
      <aside id="member-panel" hidden>
        <div id="mp-head"><span>群聊成员</span><b id="mp-count"></b></div>
        <div id="mp-search"><input id="mp-filter" type="text" placeholder="搜索成员"></div>
        <div id="mp-list"></div>
      </aside>
      <footer id="composer">
        <div id="reply-box" hidden></div>
        <div id="pending-segs" hidden></div>
        <div id="toolbar">
          <button id="btn-at" title="提及群成员">@</button>
          <button id="btn-image" title="发图片">🖼️</button>
          <button id="btn-original" title="发送原图（不压缩，超过 25MB 自动转压缩）"><span class="orig-dot"></span><span>原图</span></button>
          <button id="btn-file" title="发文件（对方点保存才开始传输）">📎</button>
          <button id="btn-voice" title="语音消息（点击开始/发送，Esc 取消）">🎤</button>
          <input id="image-input" type="file" accept="image/*" hidden>
          <input id="file-input" type="file" hidden>
        </div>
        <textarea id="input" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
        <div id="composer-bar">
          <span id="rec-indicator" hidden></span>
          <span id="send-hint"></span>
          <button id="btn-send">发送(S)</button>
        </div>
      </footer>
    </div>
  </main>
</div>
<div id="modal-backdrop" hidden><div id="modal"></div></div>
<!-- 拖文件到窗口：覆盖提示 + 二次确认 -->
<div id="drop-overlay" hidden><div class="drop-inner">📥 松开鼠标，把文件发到当前会话</div></div>
<div id="drop-confirm" hidden>
  <div class="dc-box">
    <div class="dc-title">确认发送文件</div>
    <div class="dc-target" id="dc-target"></div>
    <div class="dc-list" id="dc-list"></div>
    <label class="dc-asfile"><input type="checkbox" id="dc-asfile"> 全部作为文件原样发送（不按图片压缩）</label>
    <div class="dc-actions">
      <button class="mini" id="dc-cancel">取消</button>
      <button class="mini primary" id="dc-ok">确认发送</button>
    </div>
  </div>
</div>
<div id="lightbox" hidden>
  <img id="lightbox-img" alt="">
  <div id="lightbox-bar">
    <button class="mini primary" id="lightbox-save">保存图片</button>
    <button class="mini" id="lightbox-open" hidden>📁 打开位置</button>
    <button class="mini" id="lightbox-close">关闭</button>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
